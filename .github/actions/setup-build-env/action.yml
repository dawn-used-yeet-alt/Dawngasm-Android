name: 'Setup Dawngasm Build Environment'
description: 'Sets up JDK, Gradle, Rust, Android SDK/NDK, and configures build caching'

inputs:
  setup-rust:
    description: 'Whether to install Rust toolchain, target, and cargo-ndk'
    required: false
    default: 'true'
  setup-android-sdk:
    description: 'Whether to verify/install Android SDK platform and build tools'
    required: false
    default: 'true'
  cache-debug-keystore:
    description: 'Whether to cache and guarantee a stable debug keystore'
    required: false
    default: 'false'
  cache-read-only:
    description: 'Whether Gradle cache should be read-only (e.g. for PR builds)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ inputs.cache-read-only == 'true' }}

    - name: Cache debug keystore
      if: inputs.cache-debug-keystore == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.android
        key: android-debug-keystore-v1

    - name: Ensure stable debug keystore
      if: inputs.cache-debug-keystore == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Cache generated hotaudio bindings and native libs
      uses: actions/cache@v4
      with:
        path: |
          app/src/main/java/net/hotaudio/extractor/hotaudio_ffi.kt
          app/src/main/java/net/hotaudio/extractor/.hotaudio-bindings-ref
          app/src/main/jniLibs
        key: hotaudio-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}-arm64-v8a
        restore-keys: |
          hotaudio-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          hotaudio-${{ runner.os }}-
          hotaudio-v2.3.0-arm64-v8a-v3

    - name: Set up Rust
      if: inputs.setup-rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Cache Rust registry and tools
      if: inputs.setup-rust == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: rust-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}
        restore-keys: |
          rust-${{ runner.os }}-

    - name: Install cargo-ndk
      if: inputs.setup-rust == 'true'
      shell: bash
      run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

    - name: Locate NDK
      if: inputs.setup-rust == 'true'
      shell: bash
      run: |
        NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
        if [ -n "$NDK_DIR" ]; then
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"
        fi

    - name: Install Android SDK packages
      if: inputs.setup-android-sdk == 'true'
      shell: bash
      run: |
        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(command -v sdkmanager)"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
