name: Bug Report
description: File a bug report to help us improve Dawngasm
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Tap '...'
        4. Observe behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Device & OS Version
      description: Your device model and Android OS version.
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Dawngasm Version
      description: App version or commit SHA where the issue occurs.
      placeholder: e.g. v1.0.42
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace
      description: Paste any relevant logcat output or crash stacktraces here.
      render: shell
    validations:
      required: false
