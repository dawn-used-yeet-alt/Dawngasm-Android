name: iOS

# iOS compilation is macOS-only. This workflow uses GitHub-hosted macOS runners so
# the project can be built for iOS without a local Mac. Builds are unsigned:
# simulator and generic-device compilation only. Device installation/TestFlight
# needs signing secrets and is handled in a later phase.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kmp-ios-migration
    paths:
      - "app/**"
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      # Kotlin/Native downloads a large prebuilt toolchain; keep it in the
      # default location so the cache below can persist it between runs.
      KONAN_DATA_DIR: ${{ github.workspace }}/.konan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # PRs only read the shared Gradle cache; branch/main pushes populate it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Cache Kotlin/Native toolchain and platform libs
        uses: actions/cache@v4
        with:
          path: .konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData-simulator
            ${{ runner.temp }}/DerivedData-device
          key: xcode-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ github.ref_name }}-
            xcode-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          java -version

      # Build both frameworks in one Gradle invocation so the daemon, build
      # cache, and Kotlin/Native caches are warm for the xcodebuild steps.
      - name: Build Kotlin/Native frameworks
        run: |
          ./gradlew --build-cache --stacktrace \
            :composeApp:linkDebugFrameworkIosSimulatorArm64 \
            :composeApp:linkDebugFrameworkIosArm64

      - name: Build Xcode app (simulator, unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Compile Xcode app (generic device, unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/DerivedData-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcode-logs
          path: |
            ${{ runner.temp }}/DerivedData-simulator/Logs/**
            ${{ runner.temp }}/DerivedData-device/Logs/**
          if-no-files-found: ignore
          retention-days: 7
