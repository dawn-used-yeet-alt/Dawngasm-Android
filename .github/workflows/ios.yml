name: iOS

# iOS compilation is macOS-only. This workflow uses GitHub-hosted macOS runners so
# the project can be built for iOS without a local Mac. Builds are unsigned:
# simulator and generic-device compilation only. Device installation/TestFlight
# needs signing secrets and is handled in a later phase.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kmp-ios-migration
    paths:
      - "app/**"
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "app/**"
      - "composeApp/**"
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          java -version

      # Phase 0 guard: this workflow is committed before the KMP/iOS target
      # exists. Skip with a notice instead of failing every Android-only PR.
      # Remove this guard once Phase 1 is merged.
      - name: Check for iOS target
        id: preflight
        shell: bash
        run: |
          if [ ! -d composeApp ] \
            || [ ! -d iosApp/iosApp.xcodeproj ] \
            || ! grep -q 'include(":composeApp")' settings.gradle.kts; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=iOS target not configured yet::Skipping iOS build until Phase 1 adds :composeApp and iosApp."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Kotlin/Native framework (simulator)
        if: steps.preflight.outputs.ready == 'true'
        run: ./gradlew --no-daemon --stacktrace :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build Xcode app (simulator, unsigned)
        if: steps.preflight.outputs.ready == 'true'
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Compile Xcode app (generic device, unsigned)
        if: steps.preflight.outputs.ready == 'true'
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Upload simulator app
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/DerivedData-simulator/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Xcode logs on failure
        if: failure() && steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-xcode-logs
          path: |
            ${{ runner.temp }}/DerivedData-simulator/Logs/**
            ${{ runner.temp }}/DerivedData-device/Logs/**
          if-no-files-found: ignore
          retention-days: 7
