name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v2.1.1). Inferred from git tag if empty.'
        required: false
        type: string
        default: ''
      is_draft:
        description: 'Publish release as draft'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-rust: 'true'
          cache-read-only: 'false'

      - name: Determine version metadata
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$(( 100 + COMMIT_COUNT ))

          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v2.1.1"
          fi
          VERSION_NAME="${TAG#v}"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Dawngasm release $TAG (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DAWNGASM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dawngasm-release.jks"
            {
              echo "DAWNGASM_KEYSTORE_PATH=$RUNNER_TEMP/dawngasm-release.jks"
              echo "DAWNGASM_KEYSTORE_PASSWORD=${{ secrets.DAWNGASM_KEYSTORE_PASSWORD }}"
              echo "DAWNGASM_KEY_ALIAS=${{ secrets.DAWNGASM_KEY_ALIAS }}"
              echo "DAWNGASM_KEY_PASSWORD=${{ secrets.DAWNGASM_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::DAWNGASM_KEYSTORE_BASE64 is missing; release APK will be unsigned."
          fi

      - name: Run verification unit tests
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:assembleRelease

      - name: Stage Android release APK
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dist-android"
          apk_file="$(find app/build/outputs/apk/release -name "*.apk" | head -1)"
          cp "$apk_file" "$RUNNER_TEMP/dist-android/Dawngasm-${VERSION_NAME}.apk"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-release-android
          path: ${{ runner.temp }}/dist-android/*.apk
          if-no-files-found: error
          retention-days: 7

  release-ios:
    name: iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Read Kotlin version
        id: kotlin_ver
        run: |
          KOTLIN_VERSION=$(grep -o 'kotlin = "[^"]*"' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "KOTLIN_VERSION=$KOTLIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain and platform libs
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
          key: konan-${{ runner.os }}-${{ steps.kotlin_ver.outputs.KOTLIN_VERSION }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('iosApp/**', 'composeApp/**') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ github.ref_name }}-
            xcode-${{ runner.os }}-

      - name: Build Kotlin/Native framework (iosArm64)
        run: ./gradlew --build-cache --stacktrace :composeApp:linkDebugFrameworkIosArm64

      - name: Resolve hotaudio extractor reference
        shell: bash
        run: |
          HOTAUDIO_REF=$(grep -o 'val hotaudioExtractorRef = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "v2.3.0")
          echo "HOTAUDIO_REF=$HOTAUDIO_REF" >> "$GITHUB_ENV"

      - name: Cache Hotaudio XCFramework and Swift bindings
        id: cache-hotaudio
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Frameworks/HotaudioFFI.xcframework
            iosApp/iosApp/Hotaudio.swift
          key: hotaudio-xcframework-${{ runner.os }}-v3-dual-${{ env.HOTAUDIO_REF }}

      - name: Set up Rust toolchain for iOS
        if: steps.cache-hotaudio.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build HotaudioFFI XCFramework and Swift bindings
        if: steps.cache-hotaudio.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-hotaudio-ios.sh "$HOTAUDIO_REF"

      - name: Compile Xcode app (generic device, unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          DEVICE_APP=$(find "$RUNNER_TEMP/DerivedData-device/Build/Products/Debug-iphoneos" -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa-package/Payload"
          cp -r "$DEVICE_APP" "$RUNNER_TEMP/ipa-package/Payload/"
          mkdir -p "$RUNNER_TEMP/dist-ios"
          (cd "$RUNNER_TEMP/ipa-package" && zip -qr "$RUNNER_TEMP/dist-ios/Dawngasm.ipa" Payload)
          echo "Successfully created Dawngasm.ipa"

      - name: Upload iOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-release-ios
          path: ${{ runner.temp }}/dist-ios/*.ipa
          if-no-files-found: error
          retention-days: 7

  release-desktop-linux:
    name: Desktop Linux (AppImage, deb, rpm, arch)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build pkg-config patchelf
          libdbus-1-dev libglib2.0-dev libfontconfig1-dev libfreetype6-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          libpulse-dev libasound2-dev
          libgl1-mesa-dev libegl1-mesa-dev libwayland-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
          libxinerama-dev libxss-dev libxkbcommon-dev libpng-dev libxtst-dev
          zlib1g-dev libcurl4-openssl-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Install SDL3
        run: |
          set -euo pipefail
          SDL_COMMIT=5d7167cbc98d1a47a940b4092b3505ebd2b95a95
          SDL_ARCHIVE="$RUNNER_TEMP/SDL-$SDL_COMMIT.tar.gz"
          SDL_SOURCE="$RUNNER_TEMP/SDL-$SDL_COMMIT"
          curl --fail --location --retry 3 \
            "https://github.com/libsdl-org/SDL/archive/$SDL_COMMIT.tar.gz" \
            --output "$SDL_ARCHIVE"
          echo 'aa9e30210a0886af6ff9e62b3fb064c94e458803f0772e44e3d60e693127ad62  '"$SDL_ARCHIVE" | sha256sum --check
          tar -xzf "$SDL_ARCHIVE" -C "$RUNNER_TEMP"

          dbus_arch_include="$(pkg-config --variable=libdir dbus-1)/dbus-1.0/include"
          sudo mkdir -p /usr/lib/dbus-1.0
          if [[ ! -e /usr/lib/dbus-1.0/include ]]; then
            sudo ln -s "$dbus_arch_include" /usr/lib/dbus-1.0/include
          fi

          cmake -S "$SDL_SOURCE" -B "$RUNNER_TEMP/sdl3-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=generic" \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic" \
            -DSDL_AVX=OFF -DSDL_AVX2=OFF -DSDL_AVX512F=OFF \
            -DSDL_REVISION=SDL-3.5.0-5d7167cbc98d1a47a940b4092b3505ebd2b95a95-5783dfb-compatible \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl3-build" --parallel 3
          sudo cmake --install "$RUNNER_TEMP/sdl3-build"
          sudo ldconfig

      - name: Install appimagetool
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y file desktop-file-utils libfuse2t64 2>/dev/null || sudo apt-get install -y file desktop-file-utils libfuse2 2>/dev/null || true
          curl -fsSL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract)
          if [[ -e /tmp/squashfs-root/usr/bin/desktop-file-validate ]] && [[ ! -s /tmp/squashfs-root/usr/bin/desktop-file-validate ]]; then
            rm -f /tmp/squashfs-root/usr/bin/desktop-file-validate
            ln -sf /usr/bin/desktop-file-validate /tmp/squashfs-root/usr/bin/desktop-file-validate
          fi
          sudo mv /tmp/squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          echo "APPIMAGETOOL=/usr/local/bin/appimagetool" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Build native clearance helper
        shell: bash
        working-directory: desktopApp/native/clearance-helper
        run: cargo build --release

      - name: Fetch patched Compose Native from fork release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.m2/repository
          ARCHIVE_URL="https://github.com/dawn-used-yeet-alt/compose-native/releases/download/v1.13.0-beta01-patched/compose-native-linux-x64-maven.tar.gz"
          if curl --fail -sSL "$ARCHIVE_URL" -o /tmp/compose-native.tar.gz; then
            tar -xzf /tmp/compose-native.tar.gz -C ~/.m2/repository
          fi

      - name: Package AppImage
        shell: bash
        working-directory: desktopApp
        run: ./gradlew --no-daemon --stacktrace :app:packageLinuxX64ReleaseAppImage

      - name: Build Debian, Fedora, and Arch Linux packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm

          mkdir -p desktopApp/packaging/bundle
          sdl_lib="$(find /usr -name "libSDL3.so.0" 2>/dev/null | head -1)"
          if [[ -n "$sdl_lib" ]]; then
            cp -L "$sdl_lib" desktopApp/packaging/bundle/libSDL3.so.0
          fi

          VERSION="2.1.1"
          cp desktopApp/packaging/nfpm.yaml /tmp/nfpm.yaml
          sed -i "s/\${VERSION}/$VERSION/g" /tmp/nfpm.yaml

          mkdir -p desktopApp/app/build/distributions
          echo "Packaging deb..."
          nfpm package -f /tmp/nfpm.yaml --packager deb --target desktopApp/app/build/distributions/Dawngasm-${VERSION}-linux-x86_64.deb

          echo "Packaging rpm..."
          nfpm package -f /tmp/nfpm.yaml --packager rpm --target desktopApp/app/build/distributions/Dawngasm-${VERSION}-linux-x86_64.rpm

          echo "Packaging archlinux..."
          nfpm package -f /tmp/nfpm.yaml --packager archlinux --target desktopApp/app/build/distributions/Dawngasm-${VERSION}-linux-x86_64.pkg.tar.zst

          ls -lh desktopApp/app/build/distributions/

      - name: Upload Linux desktop release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-release-desktop-linux
          path: |
            desktopApp/app/build/distributions/*.AppImage
            desktopApp/app/build/distributions/*.deb
            desktopApp/app/build/distributions/*.rpm
            desktopApp/app/build/distributions/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  release-desktop-windows:
    name: Desktop Windows (Zip)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Build native clearance helper
        shell: bash
        working-directory: desktopApp/native/clearance-helper
        run: cargo build --release

      - name: Package Windows Zip
        shell: bash
        working-directory: desktopApp
        run: ./gradlew --no-daemon --stacktrace :app:packageWindowsX64ReleaseZip

      - name: Upload Windows desktop release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-release-desktop-windows
          path: desktopApp/app/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  release-desktop-macos:
    name: Desktop macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: arm64
            packageTask: packageMacosArm64ReleaseDmg
            artifactPath: desktopApp/app/build/distributions/*-arm64.dmg
          - os: macos-15-intel
            target: x64
            packageTask: packageMacosX64ReleaseDmg
            artifactPath: desktopApp/app/build/distributions/*-x86_64.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install SDL3
        run: brew list sdl3 >/dev/null 2>&1 || brew install sdl3

      - name: Disable Kotlin/Native klib cache for macOS arm64
        if: matrix.target == 'arm64'
        shell: bash
        working-directory: desktopApp
        run: |
          ./gradlew --no-daemon :app:compileKotlinMacosArm64 || true
          python3 -c "
          import os, glob
          found = glob.glob(os.path.expanduser('~/.konan/**/konan.properties'), recursive=True)
          for path in found:
              with open(path, 'r') as f:
                  content = f.read()
              new_lines = [
                  line.replace('macos_arm64', '') if 'cacheableTargets' in line else line
                  for line in content.splitlines()
              ]
              with open(path, 'w') as f:
                  f.write('\n'.join(new_lines) + '\n')
          "

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Build native clearance helper
        shell: bash
        working-directory: desktopApp/native/clearance-helper
        run: cargo build --release

      - name: Package macOS DMG
        shell: bash
        working-directory: desktopApp
        run: ./gradlew --no-daemon --stacktrace :app:${{ matrix.packageTask }}

      - name: Upload macOS desktop release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-release-desktop-macos-${{ matrix.target }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Release Assets
    needs:
      - release-android
      - release-ios
      - release-desktop-linux
      - release-desktop-windows
      - release-desktop-macos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dawngasm-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate consolidated SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          rm -f checksums*.txt SHA256SUMS.txt
          echo "=== Release Assets ==="
          ls -lh
          sha256sum * > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-android.outputs.release_tag }}
          name: Dawngasm ${{ needs.release-android.outputs.release_tag }}
          files: |
            release-assets/*
          generate_release_notes: true
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
