name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.1.0). Inferred from git tag if empty.'
        required: false
        type: string
        default: ''
      is_draft:
        description: 'Publish release as draft'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          setup-rust: 'true'
          cache-read-only: 'false'

      - name: Verify release ref on main
        shell: bash
        run: |
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::warning::Current HEAD is not an ancestor of origin/main."
            fi
          fi

      - name: Determine version metadata
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag_name }}
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$(( 100 + COMMIT_COUNT ))

          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${VERSION_CODE}"
          fi
          VERSION_NAME="${TAG#v}"

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Dawngasm release $TAG (versionName=$VERSION_NAME, versionCode=$VERSION_CODE)"

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DAWNGASM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dawngasm-release.jks"
            {
              echo "DAWNGASM_KEYSTORE_PATH=$RUNNER_TEMP/dawngasm-release.jks"
              echo "DAWNGASM_KEYSTORE_PASSWORD=${{ secrets.DAWNGASM_KEYSTORE_PASSWORD }}"
              echo "DAWNGASM_KEY_ALIAS=${{ secrets.DAWNGASM_KEY_ALIAS }}"
              echo "DAWNGASM_KEY_PASSWORD=${{ secrets.DAWNGASM_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::DAWNGASM_KEYSTORE_BASE64 is missing; release APK will be unsigned."
          fi

      - name: Run verification unit tests
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:assembleRelease

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-${{ env.RELEASE_TAG }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/checksums.txt
          if-no-files-found: error
          retention-days: 60

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dawngasm ${{ env.RELEASE_TAG }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/checksums.txt
          generate_release_notes: true
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}

  release-ios:
    name: Build & Publish iOS IPA
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Read Kotlin version
        id: kotlin_ver
        run: |
          KOTLIN_VERSION=$(grep -o 'kotlin = "[^"]*"' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "KOTLIN_VERSION=$KOTLIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain and platform libs
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/kotlin-native-prebuilt-*
            ~/.konan/dependencies
          key: konan-${{ runner.os }}-${{ steps.kotlin_ver.outputs.KOTLIN_VERSION }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('iosApp/**', 'composeApp/**') }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ github.ref_name }}-
            xcode-${{ runner.os }}-

      - name: Build Kotlin/Native framework (iosArm64)
        run: ./gradlew --build-cache --stacktrace :composeApp:linkDebugFrameworkIosArm64

      - name: Resolve hotaudio extractor reference
        shell: bash
        run: |
          HOTAUDIO_REF=$(grep -o 'val hotaudioExtractorRef = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2 || echo "v2.3.0")
          echo "HOTAUDIO_REF=$HOTAUDIO_REF" >> "$GITHUB_ENV"

      - name: Cache Hotaudio XCFramework and Swift bindings
        id: cache-hotaudio
        uses: actions/cache@v4
        with:
          path: |
            iosApp/Frameworks/HotaudioFFI.xcframework
            iosApp/iosApp/Hotaudio.swift
          key: hotaudio-xcframework-${{ runner.os }}-v3-dual-${{ env.HOTAUDIO_REF }}

      - name: Set up Rust toolchain for iOS
        if: steps.cache-hotaudio.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build HotaudioFFI XCFramework and Swift bindings
        if: steps.cache-hotaudio.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-hotaudio-ios.sh "$HOTAUDIO_REF"

      - name: Compile Xcode app (generic device, unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-device" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA (for TrollStore / AltStore / SideStore / Jailbreak)
        run: |
          DEVICE_APP=$(find "$RUNNER_TEMP/DerivedData-device/Build/Products/Debug-iphoneos" -name "*.app" | head -n 1)
          mkdir -p "$RUNNER_TEMP/ipa-package/Payload"
          cp -r "$DEVICE_APP" "$RUNNER_TEMP/ipa-package/Payload/"
          (cd "$RUNNER_TEMP/ipa-package" && zip -qr "$GITHUB_WORKSPACE/Dawngasm.ipa" Payload)
          echo "Successfully created Dawngasm.ipa ($(du -h "$GITHUB_WORKSPACE/Dawngasm.ipa" | cut -f1))"

      - name: Upload IPA to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ inputs.tag_name }}"
          fi
          gh release upload "$TAG" "$GITHUB_WORKSPACE/Dawngasm.ipa" --clobber
