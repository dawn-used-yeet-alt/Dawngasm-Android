name: Desktop CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-compile:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the arm64 image and macos-15-intel is the x64 image.
        # The original macos-14/macos-13 labels were retired by GitHub in Nov 2026.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile desktop targets and run shared desktop tests
        shell: bash
        run: ./gradlew --no-daemon --build-cache --stacktrace :shared:desktopTest :desktopApp:compileKotlin

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-report-${{ matrix.os }}
          path: |
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
          if-no-files-found: ignore
          retention-days: 7
