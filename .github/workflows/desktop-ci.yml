name: Desktop CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-compile:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the arm64 image and macos-15-intel is the x64 image.
        # The original macos-14/macos-13 labels were retired by GitHub in Nov 2026.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Compile desktop targets and run shared desktop tests
        shell: bash
        run: >
          ./gradlew --no-daemon --build-cache --stacktrace
          :shared:desktopTest :desktopApp:test :desktopApp:compileKotlin

      - name: Check native clearance helper
        shell: bash
        working-directory: desktopApp/native/clearance-helper
        run: cargo check --locked

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-report-${{ matrix.os }}
          path: |
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
          if-no-files-found: ignore
          retention-days: 7

  native-spike:
    name: Native spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: linkDebugExecutableLinuxX64
          - os: windows-latest
            task: linkDebugExecutableMingwX64
          - os: macos-latest
            task: linkDebugExecutableMacosArm64
          - os: macos-15-intel
            task: linkDebugExecutableMacosX64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.4.21
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake ninja-build pkg-config patchelf
          libdbus-1-dev libglib2.0-dev libfontconfig1-dev libfreetype6-dev
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          libpulse-dev libasound2-dev
          libgl1-mesa-dev libegl1-mesa-dev libwayland-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
          libxinerama-dev libxss-dev libxkbcommon-dev libpng-dev libxtst-dev
          zlib1g-dev

      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          SDL_COMMIT=5d7167cbc98d1a47a940b4092b3505ebd2b95a95
          SDL_ARCHIVE="$RUNNER_TEMP/SDL-$SDL_COMMIT.tar.gz"
          SDL_SOURCE="$RUNNER_TEMP/SDL-$SDL_COMMIT"
          curl --fail --location --retry 3 \
            "https://github.com/libsdl-org/SDL/archive/$SDL_COMMIT.tar.gz" \
            --output "$SDL_ARCHIVE"
          echo 'aa9e30210a0886af6ff9e62b3fb064c94e458803f0772e44e3d60e693127ad62  '"$SDL_ARCHIVE" | sha256sum --check
          tar -xzf "$SDL_ARCHIVE" -C "$RUNNER_TEMP"

          dbus_arch_include="$(pkg-config --variable=libdir dbus-1)/dbus-1.0/include"
          sudo mkdir -p /usr/lib/dbus-1.0
          if [[ ! -e /usr/lib/dbus-1.0/include ]]; then
            sudo ln -s "$dbus_arch_include" /usr/lib/dbus-1.0/include
          fi

          cmake -S "$SDL_SOURCE" -B "$RUNNER_TEMP/sdl3-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_REVISION=SDL-3.5.0-5d7167cbc98d1a47a940b4092b3505ebd2b95a95-5783dfb-compatible \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          cmake --build "$RUNNER_TEMP/sdl3-build" --parallel 3
          sudo cmake --install "$RUNNER_TEMP/sdl3-build"
          sudo ldconfig

      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew list sdl3 >/dev/null 2>&1 || brew install sdl3

      - name: Link native spike
        shell: bash
        working-directory: native-spike
        run: ./gradlew --no-daemon --stacktrace :app:${{ matrix.task }}

      - name: Start Windows audio services
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
          Set-Service -Name "AudioSrv" -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name "AudioSrv" -ErrorAction SilentlyContinue

      - name: Self-test native spike
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find native-spike/app/build/bin -type f \
            \( -name '*.kexe' -o -name '*.exe' \) -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "native spike executable not found"
            find native-spike/app/build -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "found native spike binary: $binary"
          chmod +x "$binary" 2>/dev/null || true
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            sdl_dll="$(find native-spike/app/build -type f -name 'SDL3.dll' -print -quit)"
            if [[ -n "$sdl_dll" ]]; then
              echo "copying $sdl_dll next to binary"
              cp "$sdl_dll" "$(dirname "$binary")/"
            fi
          fi
          echo "running $binary --self-test"
          "$binary" --self-test

      - name: Upload native spike on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-spike-report-${{ matrix.os }}
          path: |
            native-spike/app/build/reports/
            native-spike/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
