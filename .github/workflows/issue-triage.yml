name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    name: Triage New Issue
    runs-on: ubuntu-latest
    steps:
      - name: Validate & Triage Issue
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const labelsToAdd = [];

            // Add triage label if no specific category label is present
            const existingLabels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            if (!existingLabels.includes('bug') && !existingLabels.includes('enhancement')) {
              labelsToAdd.push('needs-triage');
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
            }

            // Check if body is suspiciously short
            if (body.trim().length < 30) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thanks for submitting this issue! It appears to be missing detailed context or steps to reproduce. Please update the issue description using the issue template so maintainers can assist effectively."
              });
            }
