name: PR Quality Checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'The PR title subject must not start with an uppercase letter.'
          ignoreLabels: |
            dependencies

  validate-description:
    name: Validate PR Description
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Ensure description is provided
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          CLEANED_BODY=$(echo "$PR_BODY" | tr -d '[:space:]' || true)
          if [ -z "$CLEANED_BODY" ] || [ "${#CLEANED_BODY}" -lt 15 ]; then
            echo "::error::Pull request description is too short or empty. Please describe your changes and the problem they solve."
            exit 1
          fi
          echo "PR description validation passed (${#CLEANED_BODY} non-whitespace characters)."
