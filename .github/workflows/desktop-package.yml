name: Desktop packaging

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Build the app image
        run: ./gradlew --no-daemon --stacktrace :desktopApp:createDistributable

      - name: Smoke-test the packaged app
        run: |
          APP_DIR="$PWD/desktopApp/build/compose/binaries/main/app/Dawngasm"
          test -d "$APP_DIR"
          "$APP_DIR/bin/Dawngasm" --version | tee /tmp/dawngasm-version.txt
          grep -q '^Dawngasm 2\.0\.0$' /tmp/dawngasm-version.txt

      - name: Convert the app image to an AppImage file
        run: |
          APP_DIR="$PWD/desktopApp/build/compose/binaries/main/app/Dawngasm"
          test -d "$APP_DIR"

          # jlink already strips debug information; strip the remaining native
          # payload (Skiko, libjvm, the Rust helpers) before compressing.
          if command -v strip >/dev/null 2>&1; then
            find "$APP_DIR" -type f \
              \( -name '*.so' -o -name '*.so.*' -o -name 'dawngasm-clearance-helper' \) \
              -exec strip --strip-unneeded {} + 2>/dev/null || true
          fi

          cp desktopApp/icons/dawngasm.png "$APP_DIR/dawngasm.png"
          ln -sf dawngasm.png "$APP_DIR/.DirIcon"
          mkdir -p "$APP_DIR/usr/share/metainfo"
          cp desktopApp/icons/dev.dawngasm.app.appdata.xml \
            "$APP_DIR/usr/share/metainfo/dev.dawngasm.app.appdata.xml"
          cat > "$APP_DIR/dev.dawngasm.app.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dawngasm
          Comment=Audio browser and player
          Exec=Dawngasm
          Icon=dawngasm
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF
          mkdir -p "$APP_DIR/usr/share/applications"
          cp "$APP_DIR/dev.dawngasm.app.desktop" \
            "$APP_DIR/usr/share/applications/dev.dawngasm.app.desktop"
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/bin/sh
          exec "$APPDIR/bin/Dawngasm" "$@"
          EOF
          chmod +x "$APP_DIR/AppRun"
          curl -L --fail -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
            "$APP_DIR" \
            desktopApp/build/compose/binaries/main/Dawngasm-2.0.0-x86_64.AppImage

      - name: Report AppImage size
        run: |
          ls -lh desktopApp/build/compose/binaries/main/Dawngasm-*.AppImage
          du -sh "$PWD/desktopApp/build/compose/binaries/main/app/Dawngasm"
          cat desktopApp/build/reports/material-icons-prune.txt

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-linux-appimage
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/Dawngasm-*.AppImage

  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Build MSI
        run: ./gradlew --no-daemon --stacktrace :desktopApp:packageMsi

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $launcher = Get-ChildItem desktopApp/build/compose/binaries/main/app `
            -Recurse -Filter Dawngasm.exe | Select-Object -First 1
          if (-not $launcher) { throw "Packaged launcher was not found" }
          $process = Start-Process -FilePath $launcher.FullName `
            -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged app exited with $($process.ExitCode)"
          }

      - name: Sign MSI
        if: env.WINDOWS_CERTIFICATE_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "dawngasm-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi |
            Select-Object -First 1
          if (-not $msi) { throw "No MSI was produced" }
          & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $msi.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-windows
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  macos-arm64:
    name: macOS DMG (arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Linux webview build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Import Apple signing certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dawngasm-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dawngasm-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build DMG
        shell: bash
        run: |
          args=()
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            args+=("-Pcompose.desktop.mac.sign=true")
            if [ -n "$MACOS_SIGN_IDENTITY" ]; then
              args+=("-Pcompose.desktop.mac.signing.identity=$MACOS_SIGN_IDENTITY")
            fi
            if [ -n "$MACOS_SIGNING_KEYCHAIN" ]; then
              args+=("-Pcompose.desktop.mac.signing.keychain=$MACOS_SIGNING_KEYCHAIN")
            fi
          fi
          ./gradlew --no-daemon --stacktrace :desktopApp:packageDmg "${args[@]}"

      - name: Smoke-test the packaged app
        shell: bash
        run: |
          LAUNCHER=$(find desktopApp/build/compose/binaries/main/app \
            -path '*/Dawngasm.app/Contents/MacOS/Dawngasm' | head -1)
          test -n "$LAUNCHER"
          "$LAUNCHER" --version

      - name: Notarize DMG
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          DMG=$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -1)
          test -n "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-macos-arm64
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  macos-x64:
    name: macOS DMG (x64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
