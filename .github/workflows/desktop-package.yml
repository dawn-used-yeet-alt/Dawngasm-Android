          libjavascriptcoregtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktopApp/native/clearance-helper -> target

      - name: Import Apple signing certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dawngasm-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dawngasm-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build DMG
        shell: bash
        run: |
          args=()
          if [ -n "$MACOS_CERTIFICATE_P12_BASE64" ]; then
            args+=("-Pcompose.desktop.mac.sign=true")
            if [ -n "$MACOS_SIGN_IDENTITY" ]; then
              args+=("-Pcompose.desktop.mac.signing.identity=$MACOS_SIGN_IDENTITY")
            fi
            if [ -n "$MACOS_SIGNING_KEYCHAIN" ]; then
              args+=("-Pcompose.desktop.mac.signing.keychain=$MACOS_SIGNING_KEYCHAIN")
            fi
          fi
          ./gradlew --no-daemon --stacktrace :desktopApp:packageDmg "${args[@]}"

      - name: Smoke-test the packaged app
        shell: bash
        run: |
          LAUNCHER=$(find desktopApp/build/compose/binaries/main/app \
            -path '*/Dawngasm.app/Contents/MacOS/Dawngasm' | head -1)
          test -n "$LAUNCHER"
          "$LAUNCHER" --version

      - name: Notarize DMG
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          DMG=$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' | head -1)
          test -n "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dawngasm-macos-x64
          if-no-files-found: error
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
