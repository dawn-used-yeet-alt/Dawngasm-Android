name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Cache generated hotaudio bindings and native libs
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/java/net/hotaudio/extractor/hotaudio_ffi.kt
            app/src/main/java/net/hotaudio/extractor/.hotaudio-bindings-ref
            app/src/main/jniLibs
          key: hotaudio-v2.3.0-arm64-v8a-v3

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Locate NDK
        run: |
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            echo "Using NDK: $NDK_DIR"
          fi

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.DAWNGASM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dawngasm-release.jks"
            {
              echo "DAWNGASM_KEYSTORE_PATH=$RUNNER_TEMP/dawngasm-release.jks"
              echo "DAWNGASM_KEYSTORE_PASSWORD=${{ secrets.DAWNGASM_KEYSTORE_PASSWORD }}"
              echo "DAWNGASM_KEY_ALIAS=${{ secrets.DAWNGASM_KEY_ALIAS }}"
              echo "DAWNGASM_KEY_PASSWORD=${{ secrets.DAWNGASM_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::DAWNGASM_KEYSTORE_BASE64 is missing; the release APK will be unsigned."
          fi

      - name: Test and build debug APK
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Test and build release APK
        if: github.event_name == 'push'
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Upload debug APK
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v5
        with:
          name: dawngasm-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: dawngasm-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
